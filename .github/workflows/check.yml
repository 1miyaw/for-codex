name: Framework checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Offline behavioral tests
        run: python3 -m unittest -v test_agent
      - name: Demo and checkpoint resume
        run: |
          python3 agent.py --demo --out runs/ci
          python3 agent.py --demo --out runs/ci
      - name: Isolated executor smoke test
        run: |
          docker pull python:3.11-slim
          OMICS_TEST_IMAGE=python:3.11-slim python3 -m unittest -v test_agent.FrameworkTests.test_docker_executes_without_gold
